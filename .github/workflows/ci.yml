name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Verify the Pi 1.4.0 dependency tree
        run: npm ls @earendil-works/pi-coding-agent @earendil-works/pi-ai @earendil-works/pi-agent-core @earendil-works/pi-tui
      - run: npm run release:status -- --since origin/main
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
